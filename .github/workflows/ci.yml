name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: CI only ever needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Third-party actions are pinned to full commit SHAs (the trailing comment
      # is the release). Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install (lockfile must be up to date)
        run: pnpm install --frozen-lockfile

      # Cheapest, most project-specific check first.
      - name: Validate data (schema, ids, no markup, https-only URLs)
        run: pnpm validate:data

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      # Hostile markup in any text field must never reach the page as HTML.
      - name: Escaping regression test
        run: pnpm test:escaping

      - name: Audit production dependencies (fails on high or critical)
        run: pnpm audit --prod --audit-level high

      - name: Build
        run: pnpm build

      # Dev-tooling advisories are reported but do not block a merge: they never
      # ship to the browser or run on the host. Review them when they appear.
      - name: Audit all dependencies (informational)
        continue-on-error: true
        run: pnpm audit
