allowBuilds:
  sharp: set this to true or false
  unrs-resolver: set this to true or false
# Single-app project (not a monorepo). This file only carries pnpm settings,
# which pnpm 11 reads from here instead of package.json. It approves the
# prebuilt native packages Next/ESLint pull in so installs run non-interactively.
onlyBuiltDependencies:
  - sharp
  - unrs-resolver

# Security: force patched versions of transitive dev-tooling packages that their
# parents (eslint, eslint-config-next, @tailwindcss/postcss) still pin to
# vulnerable releases. All of these are build-time only; none ship to the browser.
# Re-check with `pnpm audit` and drop an entry once its parent catches up.
overrides:
  "brace-expansion@<2": "^1.1.21"
  "brace-expansion@>=5": "^5.0.12"
  "browserslist": "^4.28.7"
  "baseline-browser-mapping": "^2.11.0"
  "js-yaml@>=4": "^4.3.2"
  "nanoid@<4": "^3.3.18"
  "postcss": "^8.5.29"
  "source-map-js": "^1.2.2"
